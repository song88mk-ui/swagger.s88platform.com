        example: USD
      payout:
        type: number
        format: decimal
        summary: Winning amount of the Bet
        example: 169.6
      nonTaxedPayout:
        type: number
        format: decimal
        summary: The total amount added to player wallet after settlement of the bet less tax.
        example: 233.75
      stake:
        type: number
        format: decimal
        summary: Amount that the player placed on a bet
        example: 125
      odds:
        type: number
        format: decimal
        summary: Odds that the bet was placed on
        example: 1.87
      betStatus:
        type: string
        summary: Status of the bet
        example: Won
      stakeTax:
        type: number
        format: decimal
        summary: Refers to a deduction or tax applied to the stake amount before it is placed
        example: 0.2
      winningsTax:
        type: number
        format: decimal
        summary: Winnings tax referes to a tax imposed on the winnings a player receives.
        example: 0.2
      taxedStake:
        type: number
        format: decimal
        summary: The stake amount after the deduction of applicable taxes or fees
        example: 25
      taxedWinnings:
        type: number
        format: decimal
        summary: The winnings amount after the deduction of applicable taxes or fees
        example: 17.4
      parlayBonusWinnings:
        type: number
        format: decimal
        summary: The additional amount added to the parlay winnings if parlay bonus has been set in BO
        example: 0
      parlayBonus:
        type: number
        format: decimal
        summary: Additional bonus winnings on parlay of palyers (this can be configured in our BO)
        example: 0
      stakeReal:
        type: number
        format: decimal
        summary: Amount of bet placed from real money
        example: 125
      stakeBonus:
        type: number
        format: decimal
        summary: Amount of bet placed from bonus money
        example: 0
      stakeRealPayout:
        type: number
        format: decimal
        summary: Amount of payout based on real money
        example: 169.6
      stakeBonusPayout:
        type: number
        format: decimal
        summary: Amount of payout based on bonus money
        example: 0
      transactionDate:
        type: string
        format: date-time
        summary: Date and time the bet was placed on
        example: 2021-02-11T05:00:00.000Z
      betSelections:
        type: array
        summary: List of Selections under bet
        uniqueItems: false
        items:
          type: object
          properties:
            betSelectionId:
              type: string
              summary: Unique Id of a Bet Selection
              example: 4ADC5126-4629-49A9-D967-08D78438E084
            betSelectionStatus:
              type: string
              summary: Settlement Status of the Selection
              example: Won
            sportId:
              type: number
              format: int32
              summary: Id of the Sport the selection is under
              example: 1
            sportName:
              type: string
              summary: Name of the sport the selection is under
              example: Soccer
            segmentId:
              type: number
              format: int32
              summary: Id of the segment the selection is under
              example: 393
            segmentName:
              type: string
              summary: Name of the segment the selection is under
              example: International Clubs
            leagueId:
              type: number
              format: int32
              summary: Id of the league the selection is under
              example: 7
            leagueName:
              type: string
              summary: Name of the league the selection is under
              example: UEFA Champions League
            fixtureId:
              type: string
              summary: Id of the Fixture the selection is under
              example: 604711342804345617
            fixtureName:
              type: string
              summary: Name of the Fixture the selection is under
              example: Manchester United vs. Manchester City
            fixtureStartDate:
              type: string
              format: date-time
              summary: Date and time the Fixture starts
              example: 2021-02-11T03:00:00.000Z
            fixtureStatus:
              type: string
              summary: Current Status of the Fixture
              example: Prematch
            score:
              type: string
              summary: Score when the bet was placed
              example: 0 - 0
            settlementScore:
              type: string
              summary: Score when the selection was settled
              example: 1 - 0
            marketId:
              type: string
              summary: Id of the Market the selection is under
              example: 605340591001174025
            marketName:
              type: string
              summary: Name of the Market the selection is under
              example: Handicap
            line:
              type: string
              summary: Line of the selection
              example: -1.25
            selectionId:
              type: string
              summary: Id of the Selection
              example: 605340591001174027
            selectionName:
              type: string
              summary: Name of the Selection
              example: Home
            odds:
              type: number
              format: decimal
              summary: Current Odds of the Selections
              example: 1.87
            homeName:
              type: string
              summary: Name of the Home Team
              example: Manchester United
            awayHome:
              type: string
              summary: Name of the Away Team
              example: Manchester City
            deadHeatFactor:
              type: number
              format: decimal
              summary: Value calculated against odds to reduce the payout of player if result of the match is win by dead heat
              example: 1
            marketTemplateId:
              type: string
              example: 1

